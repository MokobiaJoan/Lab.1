name: C++ CI Pipeline

on:
  push:
    branches: 
    - main
    - parallel
  pull_request:
    branches: 
    - main
    - parallel

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential doxygen libgtest-dev cmake

        # Build Google Test manually (required on Ubuntu)
        cd /usr/src/gtest
        sudo cmake .
        sudo make
        sudo cp lib/*.a /usr/lib

    - name: Build the project
      run: make

    - name: Run tests
      run: make test

    - name: Run Doxygen
      run: doxygen docs/Doxyfile

    - name: Clean build artifacts
      run: make clean